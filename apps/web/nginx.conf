# nginx config for the Vaani SPA. Serves the static bundle and reverse-proxies
# /api → the API service so the browser talks to the backend same-origin (cookies
# flow, no CORS). The `api` upstream name resolves to the API service in compose.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Basic hardening headers (helmet covers the API; these cover the static app).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # API reverse proxy. `API_UPSTREAM` defaults to the compose service name:port.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Allow Server-Sent Events (chat streaming) to flow unbuffered.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # SPA history fallback — every non-file route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache the fingerprinted assets Vite emits.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
