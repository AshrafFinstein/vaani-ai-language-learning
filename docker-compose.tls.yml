# ─────────────────────────────────────────────────────────────────────────────
# TLS overlay: puts Caddy (automatic HTTPS) in front of the web container.
# Use TOGETHER with the production compose:
#   docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml \
#     --env-file .env.prod up -d --build
# Requires DOMAIN (DNS A record → this server) + TLS_EMAIL in .env.prod, and ports
# 80 + 443 open. Caddy provisions + renews Let's Encrypt certs automatically.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # The web container is no longer published directly — Caddy fronts it.
  web:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod}
      TLS_EMAIL: ${TLS_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
